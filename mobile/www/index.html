<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rent Receipt Pro</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0B1220;
        color: #F8FAFC;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: grid;
        place-items: center;
      }
      .wrap {
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #94A3B8;
        font-size: 14px;
        margin: 0;
      }
      .dot {
        width: 44px;
        height: 44px;
        margin: 0 auto 18px;
        border-radius: 14px;
        background: linear-gradient(135deg, #FF7A00, #FFB020);
        box-shadow: 0 10px 25px -5px rgba(255, 122, 0, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="dot"></div>
      <h1>Rent Receipt Pro</h1>
      <p>Connecting… check your internet connection.</p>
    </div>
  </body>
</html>
