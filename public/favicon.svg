<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111C2E"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FF7A00" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,122,0,0.3)" stroke-width="8"/>
  
  <!-- Receipt icon container -->
  <g filter="url(#glow)" transform="translate(106, 86)">
    <!-- Main receipt body with zigzag tear bottom -->
    <path d="M 0 30 C 0 13.4 13.4 0 30 0 L 270 0 C 286.6 0 300 13.4 300 30 L 300 310 L 275 292 L 250 310 L 225 292 L 200 310 L 175 292 L 150 310 L 125 292 L 100 310 L 75 292 L 50 310 L 25 292 L 0 310 Z" fill="url(#primaryGrad)"/>
    
    <!-- Receipt header bar and lines -->
    <rect x="42" y="55" width="120" height="24" rx="12" fill="#0B1220" fill-opacity="0.85"/>
    <rect x="42" y="105" width="216" height="16" rx="8" fill="#0B1220" fill-opacity="0.5"/>
    <rect x="42" y="138" width="165" height="16" rx="8" fill="#0B1220" fill-opacity="0.5"/>
    <rect x="42" y="171" width="190" height="16" rx="8" fill="#0B1220" fill-opacity="0.5"/>
    
    <!-- Verified Check circle badge -->
    <circle cx="215" cy="225" r="46" fill="#0B1220" stroke="#FFB020" stroke-width="8"/>
    <path d="M 194 225 L 208 239 L 236 211" fill="none" stroke="#FFB020" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

